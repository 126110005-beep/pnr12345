<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emergency Quota Requisition (NS 871A)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <form class="search" id="form">
      <label for="pnr">Enter the 10-digit PNR to fetch the booking</label>
      <div class="search-row">
        <input id="pnr" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="10-digit PNR" />
        <button id="check" type="submit">Fetch details</button>
      </div>
    </form>

    <div id="result" aria-live="polite"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

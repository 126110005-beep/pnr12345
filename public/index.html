<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNR Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="status.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <main class="wrap">
    <nav class="topnav"><a href="requisition.html">Open emergency quota requisition form</a></nav>

    <header class="hero">
      <h1>PNR <span>Status</span></h1>
      <p>Enter your 10-digit PNR to see the current booking status.</p>
    </header>

    <datalist id="pnrList"></datalist>
    <section id="history" class="history" hidden></section>

    <form id="pnrForm" class="search" novalidate>
      <input id="pnr" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit PNR" autocomplete="off" list="pnrList" aria-label="PNR number" />
      <button id="go" class="go" type="submit">Check status</button>
    </form>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <div id="resultActions" class="result-actions" hidden>
      <button id="refresh" class="mini-btn" type="button">Refresh status</button>
      <button id="notify" class="mini-btn" type="button">Enable change alerts</button>
      <span id="lastChecked" class="last-checked"></span>
    </div>

    <section id="result" class="card" hidden>
      <div class="card-head">
        <div>
          <div class="train" id="rTrain"></div>
          <div class="sub" id="rPnr"></div>
        </div>
        <span class="chip" id="rChart"></span>
      </div>
      <div class="route">
        <div><b id="rFrom"></b><small>From</small></div>
        <div class="arrow">&rarr;</div>
        <div><b id="rTo"></b><small>To</small></div>
      </div>
      <dl class="meta">
        <div><dt>Date of journey</dt><dd id="rDate"></dd></div>
        <div><dt>Class</dt><dd id="rClass"></dd></div>
        <div><dt>Boarding</dt><dd id="rBoard"></dd></div>
      </dl>
      <table>
        <thead><tr><th>#</th><th>Booking status</th><th>Current status</th></tr></thead>
        <tbody id="rRows"></tbody>
      </table>
      <p class="note" id="rNote"></p>
    </section>
  </main>

  <script src="history.js"></script>
  <script src="status.js"></script>
</body>
</html>

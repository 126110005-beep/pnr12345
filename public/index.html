<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNR Status Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🚆 PNR Status</h1>
    <p class="subtitle">Enter your 10-digit PNR number</p>

    <form id="pnr-form">
      <input
        id="pnr-input"
        type="text"
        inputmode="numeric"
        maxlength="10"
        placeholder="e.g. 2412345678"
        autocomplete="off"
      />
      <button type="submit" id="check-btn">Check Status</button>
    </form>

    <p id="message"></p>
    <section id="result"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
